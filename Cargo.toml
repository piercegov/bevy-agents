[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piercegovernale/bevy_agent"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Bevy is unusable without optimizations in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
